buildscript {
    dependencies {
        // Use the same version as your Flyway plugin
        classpath("org.flywaydb:flyway-database-postgresql:12.2.0")
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.flywaydb.flyway" version "12.2.0"
}

group = 'pl.uksford'
version = '0.0.1-SNAPSHOT'
description = 'uksford-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // db
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // tests
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // security
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jpa
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // mapstruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // others
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.flywaydb:flyway-core:12.2.0'
    runtimeOnly "org.flywaydb:flyway-database-postgresql:12.2.0"

}

tasks.named('test', Test) {
    include("**/*Test.class")
    useJUnitPlatform()

    testLogging {
        showStandardStreams = true
        events = ["passed", "failed", "skipped"]
    }
}

tasks.register('itTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    include("**/*IT.class")
    useJUnitPlatform()

    testLogging {
        showStandardStreams = true
        events = ["passed", "failed", "skipped"]
    }
}

flyway {
    url = 'jdbc:postgresql://localhost:5432/uksford_db'
    driver = 'org.postgresql.Driver'
    user = 'flyway'
    password = 'flyway_password'
    locations = ['classpath:db/migration']
}
