services:
  uksford_db:
    image: postgres:17
    container_name: uksford_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: uksford_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretuksford
    volumes:
      - ./../src/main/resources/user-init.sql:/docker-entrypoint-initdb.d/user-init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped